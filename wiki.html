<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>福祉用具Wiki</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f6; --paper:#fff; --ink:#202122; --sub:#54595d; --line:#a2a9b1; --line2:#eaecf0;
  --link:#3366cc; --link2:#6b4ba1; --red:#d73333; --box:#f8f9fa; --warn:#fef6e7; --warnline:#fc3;
  --add:#e6f4ea; --addink:#1e6b34; --del:#fde8e8; --delink:#9b1c1c; --accent:#36c;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101418; --paper:#1a1f24; --ink:#e8eaed; --sub:#a2a9b1; --line:#3a4148; --line2:#2a3036;
    --link:#88a3e8; --link2:#b29bd6; --box:#22282e; --warn:#3a3020; --warnline:#a8892c;
    --add:#183224; --addink:#8fd6a5; --del:#3a1f1f; --delink:#f2a5a5; --accent:#88a3e8;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;font-size:15px;line-height:1.7}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
a.new{color:var(--red)}
header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hd{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}
.logo{display:flex;align-items:center;gap:8px;color:var(--ink);font-family:"Noto Serif JP",serif;font-weight:700;font-size:18px;white-space:nowrap}
.logo:hover{text-decoration:none}
.logo svg{width:26px;height:26px}
.hd form{flex:1;display:flex;min-width:0}
.hd input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:2px 0 0 2px;font:inherit;background:var(--paper);color:var(--ink)}
.hd button{padding:0 12px;border:1px solid var(--line);border-left:0;background:var(--box);color:var(--ink);border-radius:0 2px 2px 0;cursor:pointer}
main{max-width:960px;margin:0 auto;padding:0 16px 40px}
.tabs{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--line)}
.tabs a{padding:6px 12px;font-size:14px;color:var(--link);border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
.tabs a.on{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:700}
.paper{background:var(--paper);border:1px solid var(--line);border-top:0;padding:16px 18px 24px}
.paper.solo{border-top:1px solid var(--line);margin-top:14px}
h1{font-family:"Noto Serif JP",serif;font-weight:500;font-size:26px;line-height:1.35;margin:4px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2{font-family:"Noto Serif JP",serif;font-weight:500;font-size:20px;margin:26px 0 8px;padding-bottom:3px;border-bottom:1px solid var(--line)}
h3{font-size:15px;margin:16px 0 4px}
.from{color:var(--sub);font-size:13px;margin-bottom:12px}
.toc{display:inline-block;background:var(--box);border:1px solid var(--line);padding:8px 16px 10px;font-size:14px;margin:6px 0 4px}
.toc b{display:block;text-align:center;margin-bottom:2px}
.toc ol{margin:0;padding-left:20px}
.cat{margin-top:28px;border:1px solid var(--line);background:var(--box);padding:6px 10px;font-size:13px}
.notice{background:var(--warn);border:1px solid var(--warnline);border-left-width:6px;padding:8px 12px;margin:10px 0;font-size:14px}
.empty{color:var(--sub);font-size:14px;font-style:italic}
ul{padding-left:22px;margin:6px 0} p{margin:6px 0}
.q,.a{display:flex;gap:8px;margin:6px 0}
.q{font-weight:700;margin-top:12px}
.q span,.a span{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;margin-top:2px}
.q span{background:var(--accent)} .a span{background:#14866d}
.meta{margin-top:24px;color:var(--sub);font-size:12px;border-top:1px solid var(--line2);padding-top:8px}
label{display:block;font-weight:700;margin:14px 0 4px}
label small{font-weight:400;color:var(--sub)}
textarea,input.f{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.help{font-size:12px;color:var(--sub);background:var(--box);border:1px solid var(--line2);padding:6px 10px;margin:10px 0}
.btn{display:inline-block;padding:8px 16px;border:1px solid var(--line);background:var(--box);color:var(--ink);border-radius:2px;font:inherit;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ng{color:var(--red)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.list{columns:2;column-gap:28px;padding-left:20px}
@media (max-width:600px){.list{columns:1}.logo span{display:none}h1{font-size:23px}}
.card{border:1px solid var(--line);background:var(--paper);margin:14px 0;padding:12px 14px}
.card h3{margin:0 0 2px;font-size:17px}
.diff{font-size:13px;border:1px solid var(--line2);margin:4px 0 8px;white-space:pre-wrap;word-break:break-all}
.diff div{padding:1px 8px}
.diff .add{background:var(--add);color:var(--addink)} .diff .del{background:var(--del);color:var(--delink);text-decoration:line-through}
.fl{font-size:13px;font-weight:700;margin-top:10px}
.loading{padding:40px 0;text-align:center;color:var(--sub)}
.note{background:var(--box);border:1px solid var(--line2);border-left:4px solid var(--accent);padding:8px 12px;margin:10px 0;font-size:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}
.gal>a,.gal>div{display:block;aspect-ratio:1;border:1px solid var(--line2);background:var(--box);overflow:hidden;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:28px;cursor:pointer;padding:0}
.gal .tag{position:absolute;left:0;bottom:0;right:0;font-size:11px;font-weight:700;text-align:center;color:#fff;padding:2px}
.gal .tag.add{background:#1e6b34}.gal .tag.del{background:#9b1c1c}
.gal .up{display:grid;place-items:center;font-size:12px;color:var(--sub)}
.addimg{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 12px;margin-top:2px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-origin:center center;will-change:transform}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer}
#lb .c{top:max(12px,env(safe-area-inset-top));right:12px}
#lb .p{left:8px;top:50%;transform:translateY(-50%)} #lb .n{right:8px;top:50%;transform:translateY(-50%)}
#lb .cnt{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ddd;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#202122;color:#fff;padding:10px 18px;border-radius:4px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
footer{max-width:960px;margin:0 auto;padding:0 16px 30px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<header><div class="hd">
  <a class="logo" href="./" data-nav>
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h9a3 3 0 0 1 3 3v17a2 2 0 0 0-2-2H5zM27 6h-9a3 3 0 0 0-3 3v17a2 2 0 0 1 2-2h10z"/></svg>
    <span>福祉用具Wiki</span>
  </a>
  <form id="sf"><input id="sq" type="search" placeholder="商品名で検索"><button aria-label="検索">🔍</button></form>
</div></header>
<main id="main"></main>
<footer>編集提案は管理者の承認後に反映されます ・ <a href="?admin" data-nav>管理者</a></footer>
<div id="toast"></div>
<div id="lb"><img alt=""><button class="c" aria-label="閉じる">×</button><button class="p" aria-label="前へ">‹</button><button class="n" aria-label="次へ">›</button><div class="cnt"></div></div>

<script>
// ★ GASのウェブアプリURLをここに貼る
const API_URL = 'https://script.google.com/macros/s/AKfycbzsUrPBQZVrl8qK1-v5JKqQepp83GOx1HOfAbZc_CA_I_B2Oy0Ey9ILr-xXx8Ffzoo/exec';

const SECTIONS = [
  { k: 'features', t: '特徴' },
  { k: 'cautions', t: '注意事項' },
  { k: 'faq', t: 'よくある質問' },
  { k: 'trouble', t: 'トラブル対応' }
];
const TEXT_KEYS = ['manual', ...SECTIONS.map(s => s.k)];
const KEYS = TEXT_KEYS;
const label = k => ({ manual: '説明書URL' })[k] || SECTIONS.find(s => s.k === k).t;
const $ = s => document.querySelector(s);
const MAX_IMG = 10;
const emptyImgs = () => Object.fromEntries(SECTIONS.map(s => [s.k, []]));
const imgsOf = o => { const r = emptyImgs(); const src = (o && o.images) || {}; SECTIONS.forEach(s => { if (Array.isArray(src[s.k])) r[s.k] = src[s.k].slice(); }); return r; };
const thumb = id => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w800';
const fullImg = id => 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view';
const bigImg = id => 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1600';
// list は ID の配列、または [ID, 'add'|'del'] の配列
function gallery(list) {
  return '<div class="gal">' + list.map(x => {
    const [id, tag] = Array.isArray(x) ? x : [x];
    return '<a href="' + fullImg(id) + '" data-img="' + esc(id) + '" target="_blank" rel="noopener noreferrer"><img src="' + thumb(id) + '" loading="lazy" alt="">'
      + (tag ? '<span class="tag ' + tag + '">' + (tag === 'add' ? '追加' : '削除') + '</span>' : '') + '</a>';
  }).join('') + '</div>';
}
// スマホ写真を長辺1280pxのJPEGに縮めてから送る
function resizeImage(file, max = 1280) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => rej(new Error('画像を読み込めませんでした'));
    img.src = URL.createObjectURL(file);
  });
}
const main = $('#main');
let listCache = null;

/* ---------- 通信 ---------- */
async function api(action, data = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...data })
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'エラー');
  return j;
}

/* ---------- ユーティリティ ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function unesc(s) {
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
}
function pageUrl(name, mode) {
  return '?name=' + encodeURIComponent(name) + (mode ? '&mode=' + mode : '');
}
function fmt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
}
function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; }
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}
function loading() { main.innerHTML = '<div class="loading">読み込み中…</div>'; }
function fail(e) { main.innerHTML = '<div class="paper solo"><p>読み込みに失敗しました：' + esc(e.message) + '</p></div>'; }

/* ---------- 簡易記法 ---------- */
function inline(s) {
  s = esc(s);
  s = s.replace(/\[\[(.+?)\]\]/g, (_, n) => '<a href="' + pageUrl(unesc(n)) + '" data-nav>' + n + '</a>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function md(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  let out = '', list = false, para = [];
  const flushP = () => { if (para.length) { out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
  const closeL = () => { if (list) { out += '</ul>'; list = false; } };
  for (const raw of lines) {
    const l = raw.trim(); let m;
    if (!l) { flushP(); closeL(); continue; }
    if ((m = l.match(/^##\s*(.+)/))) { flushP(); closeL(); out += '<h3>' + inline(m[1]) + '</h3>'; }
    else if ((m = l.match(/^(?:-|・|\*(?!\*))\s*(.+)/))) { flushP(); if (!list) { out += '<ul>'; list = true; } out += '<li>' + inline(m[1]) + '</li>'; }
    else if ((m = l.match(/^[QＱ][:：.．]\s*(.*)/))) { flushP(); closeL(); out += '<div class="q"><span>Q</span><div>' + inline(m[1]) + '</div></div>'; }
    else if ((m = l.match(/^[AＡ][:：.．]\s*(.*)/))) { flushP(); closeL(); out += '<div class="a"><span>A</span><div>' + inline(m[1]) + '</div></div>'; }
    else { closeL(); para.push(l); }
  }
  flushP(); closeL();
  return out;
}

/* ---------- 差分 ---------- */
function diffLines(a, b) {
  a = String(a || '').split('\n'); b = String(b || '').split('\n');
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push([' ', a[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(['-', a[i++]]);
    else out.push(['+', b[j++]]);
  }
  while (i < n) out.push(['-', a[i++]]);
  while (j < m) out.push(['+', b[j++]]);
  return out;
}
function diffHtml(a, b) {
  return '<div class="diff">' + diffLines(a, b).filter(d => d[1] !== '' || d[0] !== ' ').map(([t, s]) =>
    '<div class="' + (t === '+' ? 'add' : t === '-' ? 'del' : '') + '">' + (t === ' ' ? '' : t + ' ') + esc(s || ' ') + '</div>'
  ).join('') + '</div>';
}

/* ---------- ルーティング ---------- */
function go(url) { history.pushState(null, '', url); route(); window.scrollTo(0, 0); }
window.addEventListener('popstate', route);
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-nav]');
  if (a) { e.preventDefault(); go(a.getAttribute('href')); }
});
$('#sf').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#sq').value.trim();
  go(q ? '?q=' + encodeURIComponent(q) : './');
});
function route() {
  const p = new URLSearchParams(location.search);
  if (p.has('admin')) return viewAdmin();
  const name = p.get('name');
  if (name) {
    const mode = p.get('mode');
    if (mode === 'edit') return viewEdit(name);
    if (mode === 'history') return viewHistory(name);
    return viewPage(name);
  }
  viewIndex(p.get('q') || '');
}
function tabs(name, on) {
  const t = [['read', '閲覧', pageUrl(name)], ['edit', '編集を提案', pageUrl(name, 'edit')], ['history', '履歴', pageUrl(name, 'history')]];
  return '<div class="tabs">' + t.map(([k, l, u]) => '<a href="' + u + '" data-nav class="' + (k === on ? 'on' : '') + '">' + l + '</a>').join('') + '</div>';
}

/* ---------- トップ／検索 ---------- */
async function viewIndex(q) {
  document.title = '福祉用具Wiki';
  $('#sq').value = q;
  loading();
  try { if (!listCache) listCache = (await api('list')).pages; } catch (e) { return fail(e); }
  const pages = listCache.filter(p => p.name);
  const ql = q.toLowerCase();
  const hit = q ? pages.filter(p => String(p.name).toLowerCase().includes(ql)) : pages;
  let h = '<div class="paper solo">';
  if (q) {
    h += '<h1>「' + esc(q) + '」の検索結果</h1>';
    if (!pages.some(p => p.name === q)) h += '<p>記事「<a class="new" href="' + pageUrl(q, 'edit') + '" data-nav>' + esc(q) + '</a>」を新しく作成できます。</p>';
    h += hit.length ? '<ul>' + hit.map(p => '<li><a href="' + pageUrl(p.name) + '" data-nav>' + esc(p.name) + '</a></li>').join('') + '</ul>' : '<p class="empty">一致する記事はありません</p>';
  } else {
    h += '<h1>福祉用具Wikiへようこそ</h1><p class="from">現在 ' + pages.length + ' 本の記事があります。WelSyncの商品名からも開けます。</p>';
    const recent = [...pages].sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0, 5);
    if (recent.length) h += '<h2>最近の更新</h2><ul>' + recent.map(p => '<li><a href="' + pageUrl(p.name) + '" data-nav>' + esc(p.name) + '</a> <small style="color:var(--sub)">' + fmt(p.updatedAt) + '</small></li>').join('') + '</ul>';
    if (pages.length) h += '<h2>記事一覧</h2><ul class="list">' + [...pages].sort((a, b) => String(a.name).localeCompare(String(b.name), 'ja'))
      .map(p => '<li><a href="' + pageUrl(p.name) + '" data-nav>' + esc(p.name) + '</a></li>').join('') + '</ul>';
  }
  main.innerHTML = h + '</div>';
}

/* ---------- 記事 ---------- */
async function viewPage(name) {
  document.title = name + ' - 福祉用具Wiki';
  loading();
  let r; try { r = await api('get', { name }); } catch (e) { return fail(e); }
  const pg = r.page;
  let h = tabs(name, 'read') + '<div class="paper"><h1>' + esc(name) + '</h1><div class="from">出典：福祉用具Wiki（社内）</div>';
  if (r.pending) h += '<div class="notice">この記事には承認待ちの編集提案が ' + r.pending + ' 件あります。</div>';
  if (!pg) {
    h += '<p>この記事はまだありません。</p><p>商品の特徴や注意点を知っていたら、<a href="' + pageUrl(name, 'edit') + '" data-nav>最初の内容を提案</a>してください。管理者の承認後に公開されます。</p>';
    return main.innerHTML = h + '</div>';
  }
  const imgs = imgsOf(pg);
  const filled = SECTIONS.filter(s => pg[s.k] || imgs[s.k].length);
  if (filled.length >= 2) h += '<div class="toc"><b>目次</b><ol>' + filled.map(s => '<li><a href="#' + s.k + '">' + s.t + '</a></li>').join('') + '</ol></div>';
  if (/^https?:\/\//i.test(String(pg.manual || ''))) h += '<h2>取扱説明書</h2><p><a href="' + esc(pg.manual) + '" target="_blank" rel="noopener noreferrer">📄 取扱説明書を開く</a></p>';
  SECTIONS.forEach(s => {
    const has = pg[s.k] || imgs[s.k].length;
    h += '<h2 id="' + s.k + '">' + s.t + '</h2>' + (pg[s.k] ? md(pg[s.k]) : '') + (imgs[s.k].length ? gallery(imgs[s.k]) : '')
      + (has ? '' : '<p class="empty">まだ記載がありません。<a href="' + pageUrl(name, 'edit') + '" data-nav>追記を提案</a></p>');
  });
  h += '<div class="meta">最終更新：' + fmt(pg.updatedAt) + '（' + esc(pg.updatedBy) + ' さんの提案）</div>';
  main.innerHTML = h + '</div>';
}

/* ---------- 編集提案 ---------- */
async function viewEdit(name) {
  document.title = name + ' を編集 - 福祉用具Wiki';
  loading();
  let r; try { r = await api('get', { name }); } catch (e) { return fail(e); }
  const pg = r.page || {};
  let h = tabs(name, 'edit') + '<div class="paper"><h1>「' + esc(name) + '」の編集を提案</h1>';
  h += '<div class="note"><b>全部うめなくて大丈夫です。</b>わかる項目だけ書いて送ってください。1行だけの追記でもOKです。<br>送った内容はすぐには反映されず、管理者が確認してから公開されます。</div>';
  h += '<form id="ef">';
  h += '<label>説明書URL <small>（メーカーの取扱説明書のページなど）</small></label><input class="f" type="url" name="manual" value="' + esc(pg.manual) + '" placeholder="https://">';
  SECTIONS.forEach(s => {
    h += '<label>' + s.t + '</label><textarea name="' + s.k + '">' + esc(pg[s.k]) + '</textarea>';
    h += '<div class="gal" data-gal="' + s.k + '"></div><label class="btn addimg">📷 ' + s.t + 'に画像を追加<input type="file" accept="image/*" multiple hidden data-file="' + s.k + '"></label>';
  });
  h += '<p class="from" style="margin-top:14px">※ お客様のお宅や、人が写った写真は載せないでください。</p>';
  h += '<label>あなたの名前</label><input class="f" name="proposer" required value="' + esc(store('wiki_name') || '') + '">';
  h += '<div class="row"><button class="btn pri" id="sb">提案を送信</button><a class="btn" href="' + pageUrl(name) + '" data-nav>キャンセル</a></div></form>';
  main.innerHTML = h + '</div>';

  // 画像の追加・削除（項目ごと）
  const orig = imgsOf(pg), imgs = imgsOf(pg), busy = emptyImgs();
  const draw = k => {
    main.querySelector('[data-gal="' + k + '"]').innerHTML =
      imgs[k].map((id, i) => '<div><img src="' + thumb(id) + '" alt=""><button type="button" class="x" data-k="' + k + '" data-i="' + i + '" aria-label="削除">×</button></div>').join('')
      + (busy[k].length ? '<div class="up">アップ中…</div>' : '');
  };
  SECTIONS.forEach(s => draw(s.k));
  main.addEventListener('click', e => {
    const b = e.target.closest('.x[data-k]');
    if (b) { imgs[b.dataset.k].splice(Number(b.dataset.i), 1); draw(b.dataset.k); }
  });
  main.querySelectorAll('[data-file]').forEach(inp => inp.addEventListener('change', async e => {
    const k = inp.dataset.file, files = [...e.target.files]; e.target.value = '';
    for (const f of files) {
      if (imgs[k].length + busy[k].length >= MAX_IMG) { toast('1項目につき画像は' + MAX_IMG + '枚までです'); break; }
      busy[k].push(1); draw(k);
      try {
        const data = await resizeImage(f);
        const r = await api('upload', { name, data });
        imgs[k].push(r.id);
      } catch (err) { toast('画像のアップに失敗：' + err.message); }
      busy[k].pop(); draw(k);
    }
  }));

  $('#ef').addEventListener('submit', async e => {
    e.preventDefault();
    if (SECTIONS.some(s => busy[s.k].length)) return toast('画像のアップが終わるまで待ってください');
    const fd = Object.fromEntries(new FormData(e.target));
    fd.images = imgs;
    const changed = KEYS.some(k => (fd[k] || '').trim() !== String(pg[k] || '').trim()) || JSON.stringify(imgs) !== JSON.stringify(orig);
    if (!changed) return toast('変更がありません');
    $('#sb').disabled = true;
    try {
      store('wiki_name', fd.proposer.trim());
      await api('propose', { name, ...fd });
      toast('提案を送信しました。承認後に反映されます');
      go(pageUrl(name));
    } catch (err) { toast(err.message); $('#sb').disabled = false; }
  });
}

/* ---------- 履歴 ---------- */
async function viewHistory(name) {
  document.title = name + ' の履歴 - 福祉用具Wiki';
  loading();
  let r; try { r = await api('history', { name }); } catch (e) { return fail(e); }
  let h = tabs(name, 'history') + '<div class="paper"><h1>「' + esc(name) + '」の更新履歴</h1>';
  h += r.history.length ? '<ul>' + r.history.map(x => '<li>' + fmt(x.reviewedAt) + ' ― ' + esc(x.proposer) + ' さん' + '</li>').join('') + '</ul>' : '<p class="empty">まだ履歴はありません</p>';
  main.innerHTML = h + '</div>';
}

/* ---------- 管理者 ---------- */
async function viewAdmin() {
  document.title = '管理者 - 福祉用具Wiki';
  const key = store('wiki_admin');
  if (!key) {
    main.innerHTML = '<div class="paper solo"><h1>管理者ログイン</h1><form id="lf"><label>管理者キー</label><input class="f" type="password" name="key" required><div class="row"><button class="btn pri">ログイン</button></div></form></div>';
    $('#lf').addEventListener('submit', async e => {
      e.preventDefault();
      const k = e.target.key.value.trim();
      try { await api('login', { key: k }); store('wiki_admin', k); viewAdmin(); } catch (err) { toast(err.message); }
    });
    return;
  }
  loading();
  let r;
  try { r = await api('pending', { key }); }
  catch (e) { if (/キー/.test(e.message)) { store('wiki_admin', null); return viewAdmin(); } return fail(e); }
  let h = '<div class="paper solo"><h1>承認待ちの提案（' + r.list.length + '件）</h1>';
  if (!r.list.length) h += '<p class="empty">承認待ちはありません。</p>';
  r.list.forEach(({ proposal: p, current: c, conflict }, i) => {
    c = c || {};
    h += '<div class="card" data-i="' + i + '"><h3><a href="' + pageUrl(p.name) + '" data-nav>' + esc(p.name) + '</a>' + (c.name ? '' : ' <small style="color:var(--red)">新規</small>') + '</h3>';
    h += '<div class="from">' + esc(p.proposer) + ' さん ・ ' + fmt(p.createdAt) + '</div>';
    if (conflict) h += '<div class="notice">この提案の後に記事が更新されています。承認すると上書きされるので、内容を確認してください。</div>';
    let any = false;
    TEXT_KEYS.forEach(k => {
      if (String(p[k] || '') === String(c[k] || '')) return;
      any = true;
      h += '<div class="fl">' + label(k) + '</div>' + diffHtml(c[k], p[k]);
    });
    const ci = imgsOf(c), pi = imgsOf(p);
    SECTIONS.forEach(s => {
      const added = pi[s.k].filter(x => !ci[s.k].includes(x)), removed = ci[s.k].filter(x => !pi[s.k].includes(x));
      if (!added.length && !removed.length) return;
      any = true;
      h += '<div class="fl">' + s.t + 'の画像</div>' + gallery([...added.map(id => [id, 'add']), ...removed.map(id => [id, 'del'])]);
    });
    if (!any) h += '<p class="empty">変更点はありません</p>';
    h += '<div class="fix" hidden>' + TEXT_KEYS.map(k =>
      '<label>' + label(k) + '</label>' +
      (k === 'manual' ? '<input class="f" data-k="' + k + '" value="' + esc(p[k]) + '">' : '<textarea data-k="' + k + '">' + esc(p[k]) + '</textarea>')
    ).join('') + '</div>';
    h += '<div class="row"><button class="btn pri" data-act="ok">承認</button><button class="btn" data-act="fix">修正して承認</button><button class="btn ng" data-act="ng">却下</button></div></div>';
  });
  h += '<div class="row"><button class="btn" id="lo">ログアウト</button></div>';
  main.innerHTML = h + '</div>';
  $('#lo').onclick = () => { store('wiki_admin', null); viewAdmin(); };
  main.querySelectorAll('.card').forEach(card => {
    const p = r.list[card.dataset.i].proposal;
    const fix = card.querySelector('.fix');
    card.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const act = b.dataset.act;
      let body = { key, id: p.id };
      if (act === 'fix' && fix.hidden) { fix.hidden = false; b.textContent = 'この内容で承認'; return; }
      if (act === 'ok') body.decision = 'approve';
      if (act === 'fix') {
        body.decision = 'approve'; body.final = {};
        fix.querySelectorAll('[data-k]').forEach(el => body.final[el.dataset.k] = el.value);
        body.note = '管理者が修正して承認';
      }
      if (act === 'ng') {
        const note = prompt('却下の理由（任意）');
        if (note === null) return;
        body.decision = 'reject'; body.note = note;
      }
      card.querySelectorAll('button').forEach(x => x.disabled = true);
      try {
        await api('review', body);
        listCache = null;
        toast(body.decision === 'approve' ? '承認しました' : '却下しました');
        viewAdmin();
      } catch (err) { toast(err.message); card.querySelectorAll('button').forEach(x => x.disabled = false); }
    });
  });
}

/* ---------- 画像をその場で拡大（ピンチ・ダブルタップでズーム） ---------- */
const lb = $('#lb'), lbImg = lb.querySelector('img');
let lbList = [], lbIdx = 0;
let zs = 1, zx = 0, zy = 0;               // 倍率と移動量
const Z_MAX = 5;
function zApply(anim) {
  lbImg.style.transition = anim ? 'transform .2s' : 'none';
  lbImg.style.transform = 'translate(' + zx + 'px,' + zy + 'px) scale(' + zs + ')';
}
function zClamp() {
  if (zs <= 1) { zs = 1; zx = 0; zy = 0; return; }
  const mx = Math.max(0, (lbImg.offsetWidth * zs - innerWidth) / 2);
  const my = Math.max(0, (lbImg.offsetHeight * zs - innerHeight) / 2);
  zx = Math.min(mx, Math.max(-mx, zx)); zy = Math.min(my, Math.max(-my, zy));
}
// 画面上の点 (px,py) を中心に倍率を変える
function zZoomAt(ns, px, py, anim) {
  ns = Math.min(Z_MAX, Math.max(1, ns));
  const cx = px - innerWidth / 2, cy = py - innerHeight / 2;
  zx = cx - (cx - zx) * (ns / zs); zy = cy - (cy - zy) * (ns / zs); zs = ns;
  zClamp(); zApply(anim);
}
function zToggle(px, py) { zs > 1 ? (zs = 1, zClamp(), zApply(true)) : zZoomAt(2.5, px, py, true); }
function lbShow() {
  zs = 1; zx = 0; zy = 0; zApply();
  lbImg.src = bigImg(lbList[lbIdx]);
  const many = lbList.length > 1;
  lb.querySelector('.p').hidden = lb.querySelector('.n').hidden = !many;
  lb.querySelector('.cnt').textContent = many ? (lbIdx + 1) + ' / ' + lbList.length : '';
}
function lbMove(d) { if (lbList.length > 1) { lbIdx = (lbIdx + d + lbList.length) % lbList.length; lbShow(); } }
function lbClose() { lb.classList.remove('on'); lbImg.src = ''; document.body.style.overflow = ''; }

document.addEventListener('click', e => {
  const a = e.target.closest('a[data-img]');
  if (!a) return;
  e.preventDefault();
  const items = [...a.closest('.gal').querySelectorAll('a[data-img]')];
  lbList = items.map(x => x.dataset.img); lbIdx = items.indexOf(a);
  lbShow(); lb.classList.add('on'); document.body.style.overflow = 'hidden';
});

// ボタン・背景のクリック（タッチ直後の疑似クリックは無視）
let lastTouch = 0;
lb.addEventListener('click', e => {
  if (e.target.closest('.c')) return lbClose();
  if (e.target.closest('.p')) return lbMove(-1);
  if (e.target.closest('.n')) return lbMove(1);
  if (Date.now() - lastTouch < 600) return;
  if (e.target !== lbImg && zs === 1) lbClose();
});

// スマホ：ピンチ・ドラッグ・ダブルタップ・スワイプ
let t0 = null, lastTap = 0;
const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });
lb.addEventListener('touchstart', e => {
  if (e.target.closest('button')) return;
  const t = e.touches;
  if (t.length === 2) t0 = { pinch: true, d: dist(t[0], t[1]), m: mid(t[0], t[1]), s: zs, x: zx, y: zy };
  else if (t.length === 1 && !(t0 && t0.pinch)) t0 = { pinch: false, sx: t[0].clientX, sy: t[0].clientY, x: zx, y: zy, moved: false, onImg: e.target === lbImg };
}, { passive: true });
lb.addEventListener('touchmove', e => {
  if (!t0) return;
  e.preventDefault();
  const t = e.touches;
  if (t0.pinch && t.length === 2) {
    const ns = Math.min(Z_MAX, Math.max(1, t0.s * dist(t[0], t[1]) / t0.d));
    const m = mid(t[0], t[1]), cx = innerWidth / 2, cy = innerHeight / 2;
    zx = (m.x - cx) - ((t0.m.x - cx) - t0.x) * (ns / t0.s);
    zy = (m.y - cy) - ((t0.m.y - cy) - t0.y) * (ns / t0.s);
    zs = ns; zApply();
  } else if (!t0.pinch && t.length === 1) {
    const dx = t[0].clientX - t0.sx, dy = t[0].clientY - t0.sy;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) t0.moved = true;
    if (zs > 1) { zx = t0.x + dx; zy = t0.y + dy; zClamp(); zApply(); }
  }
}, { passive: false });
lb.addEventListener('touchend', e => {
  lastTouch = Date.now();
  if (!t0) return;
  if (t0.pinch) { if (e.touches.length === 0) { zClamp(); zApply(true); t0 = null; } return; }
  const ct = e.changedTouches[0], dx = ct.clientX - t0.sx;
  if (!t0.moved) {
    if (Date.now() - lastTap < 300) { zToggle(ct.clientX, ct.clientY); lastTap = 0; }
    else { lastTap = Date.now(); if (!t0.onImg && zs === 1) setTimeout(() => { if (lastTap && Date.now() - lastTap >= 290) lbClose(); }, 300); }
  } else if (zs === 1 && Math.abs(dx) > 50) lbMove(dx < 0 ? 1 : -1);
  t0 = null;
});

// パソコン：ホイールでズーム、ダブルクリック、ドラッグで移動
lb.addEventListener('wheel', e => { e.preventDefault(); zZoomAt(zs * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive: false });
lbImg.addEventListener('dblclick', e => { if (Date.now() - lastTouch > 600) zToggle(e.clientX, e.clientY); });
let drag = null;
lbImg.addEventListener('mousedown', e => { if (zs > 1) { e.preventDefault(); drag = { sx: e.clientX, sy: e.clientY, x: zx, y: zy }; } });
document.addEventListener('mousemove', e => { if (drag) { zx = drag.x + e.clientX - drag.sx; zy = drag.y + e.clientY - drag.sy; zClamp(); zApply(); } });
document.addEventListener('mouseup', () => { drag = null; });

document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') lbClose(); else if (e.key === 'ArrowLeft') lbMove(-1); else if (e.key === 'ArrowRight') lbMove(1);
});

route();
</script>
